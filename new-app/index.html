<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova versão AgroMacro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="new-app">
        <header class="app-header">
            <div>
                <p class="app-subtitle">Cadastros + movimentações</p>
                <h1>Pastos em movimento</h1>
            </div>
        </header>
        <main class="app-main">
        <section class="home-cards">
            <button class="home-card" data-view="pastos">Pastos & cadastros</button>
            <button class="home-card" data-view="manejo">Manejo & aplicações</button>
            <button class="home-card" data-view="estoque">Estoque</button>
            <button class="home-card" data-view="financeiro">Financeiro</button>
            <button class="home-card" data-view="mapa">Mapa</button>
        </section>
        <section id="pasto-dashboard" class="panel-card"></section>
        <section id="feature-container" class="feature-container"></section>
    </main>
    </div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
