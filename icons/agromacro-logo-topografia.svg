<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradient da Terra Roxa para Verde Titânio -->
  <defs>
    <linearGradient id="topoGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00796B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fundo escuro (Preto Titânio) -->
  <rect width="200" height="200" fill="#0F1318"/>

  <!-- Linhas topográficas formando CUPIM (elevação) -->
  <!-- Camada 1: Base do cupim (linhas mais afastadas) -->
  <path d="M 70 140 Q 100 120 130 140" stroke="url(#topoGradient)" stroke-width="1.2" fill="none" opacity="0.4"/>

  <!-- Camada 2: Corpo inferior do cupim -->
  <path d="M 75 125 Q 100 110 125 125" stroke="url(#topoGradient)" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Camada 3: Corpo médio do cupim -->
  <path d="M 80 110 Q 100 95 120 110" stroke="url(#topoGradient)" stroke-width="1.8" fill="none" opacity="0.7"/>

  <!-- Camada 4: Pico do cupim (topo) -->
  <path d="M 85 95 Q 100 80 115 95" stroke="url(#topoGradient)" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- Camada 5: Pico máximo (ápice da topografia) -->
  <path d="M 90 80 Q 100 70 110 80" stroke="url(#topoGradient)" stroke-width="2.2" fill="none" opacity="0.9"/>

  <!-- Camada 6: Crista superior (ponto mais alto) -->
  <path d="M 95 65 Q 100 58 105 65" stroke="url(#topoGradient)" stroke-width="2.4" fill="none" opacity="1"/>

  <!-- LINHA DE DORSO (curva suave do pescoço até a cauda) -->
  <!-- Camada 1: Linha dorsal base -->
  <path d="M 60 110 Q 75 90 100 60 Q 125 90 140 110"
        stroke="url(#topoGradient)" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Camada 2: Dorso principal (mais proeminente) -->
  <path d="M 55 120 Q 75 95 100 55 Q 125 95 145 120"
        stroke="url(#topoGradient)" stroke-width="2" fill="none" opacity="0.75"/>

  <!-- Camada 3: Dorso superior (contorno mais fino) -->
  <path d="M 50 130 Q 70 100 100 50 Q 130 100 150 130"
        stroke="url(#topoGradient)" stroke-width="2.5" fill="none" opacity="0.9"/>

  <!-- Detalhes secundários: Contornos de precisão (como scanning de drone) -->
  <!-- Contorno esquerdo do cupim -->
  <path d="M 85 95 Q 80 100 75 110" stroke="#8B4513" stroke-width="0.8" fill="none" opacity="0.3" stroke-dasharray="2,3"/>

  <!-- Contorno direito do cupim -->
  <path d="M 115 95 Q 120 100 125 110" stroke="#8B4513" stroke-width="0.8" fill="none" opacity="0.3" stroke-dasharray="2,3"/>

  <!-- Ponto focal: Centro do cupim (máxima elevação) -->
  <circle cx="100" cy="58" r="2" fill="#FFFEF0" opacity="0.8"/>

  <!-- Halo sutil ao redor do pico (efeito de profundidade) -->
  <circle cx="100" cy="58" r="6" stroke="#00796B" stroke-width="0.5" fill="none" opacity="0.4"/>
</svg>